name: Kreafy Free Draft Studio

# Draft-only preparation: no model keys, Buffer tokens, Drive access or publishing.
on:
  schedule:
    - cron: '0 3 * * 1,3,5'
  workflow_dispatch:
    inputs:
      campaign_start:
        description: 'First editorial date (YYYY-MM-DD); does not schedule publication'
        default: '2026-10-26'
        required: true

permissions:
  contents: read

concurrency:
  group: kreafy-free-drafts
  cancel-in-progress: false

jobs:
  prepare-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-free.txt
      - name: Install free rendering dependency
        run: pip install -r requirements-free.txt
      - name: Verify content, approval and delivery safeguards
        run: python -m unittest discover -s tests -v
      - name: Prepare original campaign previews
        env:
          CAMPAIGN_START: ${{ inputs.campaign_start || '2026-10-26' }}
        run: python -m studio prepare --start "$CAMPAIGN_START"
      - name: Save unpublished previews and blank KPI scorecard
        uses: actions/upload-artifact@v4
        with:
          name: kreafy-unpublished-previews-${{ github.run_number }}
          path: studio-output/
          retention-days: 30
      - name: Explain completion boundary
        run: |
          echo 'Prepared finite editorial bank. No model API charges, sharing changes, messages or publishing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Inspect artifact index.html. Source links, account connection, public assets and platform approval remain delivery prerequisites.' >> "$GITHUB_STEP_SUMMARY"
